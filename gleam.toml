name = "grice"
version = "0.1.0"
description = "A type-aware linter for Gleam, with clear, compiler-style diagnostics."
licences = ["Apache-2.0"]
repository = { type = "github", user = "alvivi", repo = "grice" }
# The oldest compiler grice is checked on: CI's floor job builds and tests with
# it. grice depends on girard, so this can't drop below girard's floor.
gleam = ">= 1.15.4"

[documentation]
pages = [
  { title = "Configuration", path = "configuration.html", source = "docs/CONFIGURATION.md" },
  { title = "JSON output", path = "json.html", source = "docs/JSON.md" },
  { title = "Changelog", path = "changelog.html", source = "CHANGELOG.md" },
]

[dependencies]
# The standard library. Any other dependency is added by the change that first
# uses it, so nothing here goes unused.
gleam_stdlib = ">= 0.44.0 and < 2.0.0"
# The Gleam parser. Each loaded module is parsed once, and its syntax tree
# is what rules see.
glance = ">= 7.0.0 and < 8.0.0"
# Type inference for typed rules. It types the load set once per run, over
# the same glance syntax trees the rules see, so their spans agree.
girard = ">= 4.0.1 and < 5.0.0"
# glance's lexer, used directly for the text of the token a parse error
# points at. It must be a direct dependency to be imported.
glexer = ">= 2.5.0 and < 3.0.0"
# File system access: walking the source directories and reading files.
simplifile = ">= 2.4.0 and < 3.0.0"
# Display widths and tab stops, to line up the carets under a source line.
string_width = ">= 3.4.3 and < 4.0.0"
# TOML parsing, to read the `[tools.grice]` table and `target` from
# `gleam.toml`.
tom = ">= 2.1.0 and < 3.0.0"
# JSON string escaping for the JSON output, which grice pretty-prints
# itself.
gleam_json = ">= 3.1.0 and < 4.0.0"
# The command-line arguments, on every target. girard depends on it too.
argv = ">= 1.1.0 and < 2.0.0"

[dev_dependencies]
# Test runner for `gleam test`.
gleeunit = ">= 1.0.0 and < 2.0.0"
# Snapshot tests of the text grice prints. `gleam run -m birdie` reviews
# new snapshots.
birdie = ">= 2.0.2 and < 3.0.0"
