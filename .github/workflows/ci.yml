name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # The pinned pair, read from `.tool-versions`: every gate.
          - name: pinned
            version-file: .tool-versions
            target: erlang
            format: true
          # The oldest compiler grice supports: the `gleam` floor in
          # `gleam.toml`. It skips `gleam format --check`: formatter output is
          # not stable across Gleam minors, and a format diff on an old
          # compiler is not a defect.
          - name: floor
            gleam: "1.15.4"
            erlang: "28.4.2"
            target: erlang
            format: false
          # The pinned pair again, building and testing for JavaScript, on
          # Node. The other gates don't depend on the target.
          - name: javascript
            version-file: .tool-versions
            target: javascript
            format: false

    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v5

      # setup-beam takes each version from the YAML or from the version file,
      # never both, so each matrix row sets only one of them.
      - uses: erlef/setup-beam@v1
        with:
          version-file: ${{ matrix.version-file }}
          gleam-version: ${{ matrix.gleam }}
          otp-version: ${{ matrix.erlang }}
          version-type: strict

      # Node, which runs the suite on the `javascript` row.
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Download dependencies
        run: gleam deps download

      - name: Check formatting
        if: matrix.format
        run: gleam format --check src/ test/

      - name: Build (warnings as errors)
        run: gleam build --warnings-as-errors --target ${{ matrix.target }}

      - name: Run tests
        run: gleam test --target ${{ matrix.target }}

      # birdie lists the snapshots `gleam test` used, so this runs after it:
      # a snapshot no test uses any more fails the job. Once is enough.
      - name: Check for stale snapshots
        if: matrix.name == 'pinned'
        run: gleam run -m birdie stale check

      # The benchmark's budgets are for the pinned pair, so only its job
      # runs it, over the corpus the tests downloaded. It fails when a pass
      # didn't analyse the whole corpus or a phase is over its budget.
      - name: Benchmark
        if: matrix.name == 'pinned'
        run: gleam run -m grice/bench
